name: River Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: river-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  river-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - name: Run River Review (midstream)
        uses: ./runners/github-action
        with:
          phase: midstream
          dry_run: true # set false after verifying secrets/models
          debug: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
