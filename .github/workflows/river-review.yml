name: River Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read # GitHub Models 推論を組み込み GITHUB_TOKEN に許可（キーレス化）

concurrency:
  group: river-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  river-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'river-review')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - name: Run River Review (midstream)
        uses: ./runners/github-action
        with:
          phase: midstream
          dry_run: false # LLM review enabled (Stage1: label opt-in)
          debug: true
          gate: false # advisory only — never fail the job
          max_cost: '0.50' # safety cap (OPENAI_MODEL とセットで有効)
        env:
          # GitHub Models 切替（キーレス化。設計書参照。ロールバックはこの env ブロックを戻す）
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }} # Bearer として GitHub Models に渡る
          RIVER_OPENAI_BASE_URL: https://models.github.ai/inference/chat/completions # CI レビュー経路が読む endpoint（review-engine.mjs）
          RIVER_OPENAI_MODEL: openai/gpt-4o-mini # 実 API 呼び出しモデル ID（GitHub Models カタログ形式）
          OPENAI_MODEL: gpt-4o-mini # max_cost の見積単価を実モデルに一致させる（見積器既定 gpt-4-turbo のままだと大型PRを誤abortするため必須の結合。prefix無しで併設）
      # #1600: the CLI auto-saves a run record (findings + calibration debug —
      # verifierStats/verifierAllRejected/findingFormat.recommendedGaps) to
      # .river/runs/*.json under GITHUB_ACTIONS, but nothing uploaded it as a
      # CI artifact, so calibration data was unobservable outside the runner.
      # if: always() — a NO_GO/rejected run is exactly when this debug data is
      # most useful. Short retention: this is calibration telemetry, not an
      # audit record (see docs/development/pipeline-params-checklist.md
      # trust-boundary note in result-store.mjs for why it is not tamper-evident).
      - name: Upload review run debug JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: river-review-run-${{ github.event.pull_request.number || 'dispatch' }}-${{ github.run_id }}
          path: .river/runs/*.json
          if-no-files-found: warn
          retention-days: 7
