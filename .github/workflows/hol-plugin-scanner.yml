name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@f776571a4dee5b70a85869eb5c188cd9a6c5bc6a # v1
        with:
          plugin_dir: '.'
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
