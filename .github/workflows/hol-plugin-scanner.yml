name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@64aaac62f076ec9786062afdd34b72b0bb6ed99e # v1
        with:
          plugin_dir: '.'
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
