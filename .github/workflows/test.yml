name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-deps
      - name: Run linters
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ matrix.node-version }}
      # #1415 root fix: the "Unable to deserialize cloned data" flake is a
      # node:test child→parent IPC (structured-clone) bug that is independent of
      # coverage. `--experimental-test-isolation=none` runs every test file in a
      # single process, removing the child→parent IPC entirely — the root cause,
      # not just the coverage aggravator. The flag now lives in the `test` npm
      # script (package.json), which is the single source of truth so that every
      # caller — CI jobs, PR templates, and local runs — gets it. This flag does
      # not exist on Node 20.x, which is EOL (2026-04), so the matrix is pinned
      # to 22.x. The full suite passes under single-process isolation (verified:
      # no shared-state pollution). Coverage is safe to collect now (no children
      # to serialize).
      - name: Run unit tests (single-process isolation, #1415)
        run: NODE_V8_COVERAGE=coverage npm test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: coverage
          flags: unittests
          fail_ci_if_error: false

  skill-validation:
    name: Skill schema validation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-deps
      - name: Validate skills
        run: npm run skills:validate
      - name: Validate promptfoo configs
        run: npm run skills:validate:promptfoo
      - name: Validate agent-skills
        run: npm run agent-skills:validate
      - name: Check dangling skill-ID references
        run: npm run skills:validate:refs
      - name: Check skill manifest freshness
        run: npm run skills:manifest:check
      - name: Check registry structural-field freshness
        run: npm run skills:registry:check

  meta-check:
    name: Meta consistency
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-deps
      - run: npm run meta:validate
      - run: npm run plugin:validate

  dist-check:
    name: Action dist freshness
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The judgement needs only git, so it runs BEFORE Node setup / npm ci.
      # When the change under review does not touch dist/ and the timestamps
      # say dist is newer than the bundled sources, the job finishes here and
      # skips the ~30-second install + build entirely.
      - name: Judge whether dist needs rebuild verification
        id: judge
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Base recorded in the event payload. Frozen when the event fired, so
          # it is only a fallback for pull_request (see the resolution below).
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Previous tip of the pushed branch. Empty for workflow_dispatch.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Base revision of the change under review.
          #
          # For pull_request, actions/checkout checks out refs/pull/N/merge,
          # which GitHub RECOMPUTES against the current base branch tip. The
          # payload's pull_request.base.sha is frozen at event time, so the two
          # drift apart whenever an old run is replayed with `gh run rerun`,
          # and the diff below then reports files the change never touched
          # (#1775: a docs-only PR was told it modifies dist/). The merge
          # commit's first parent IS the base that was actually merged into the
          # tree being inspected, so it always matches the checked-out tree.
          # fetch-depth: 0 above guarantees both parents are present.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Only a real merge commit has a second parent; if HEAD is not one
            # (checkout overridden, unexpected ref), HEAD^1 would be the head
            # branch's previous commit and would UNDER-report the change, so
            # fall back to the payload base instead of trusting it.
            if [ -n "$(git rev-parse --verify --quiet 'HEAD^2' || true)" ]; then
              BASE_SHA="$(git rev-parse --verify --quiet 'HEAD^1' || true)"
            else
              echo "HEAD is not the pull request merge commit; falling back to the event payload base."
              BASE_SHA="$PR_BASE_SHA"
            fi
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          src_ts=$(git log -1 --format=%ct -- 'runners/github-action/src/' 'runners/core/' 'src/' 'package-lock.json')
          dist_ts=$(git log -1 --format=%ct -- 'runners/github-action/dist/')

          if [ -z "$dist_ts" ]; then
            echo "::error::runners/github-action/dist/ has never been committed. Run 'npm run build:action' and commit."
            exit 1
          fi

          # Gate 1: does the change under review modify dist/ itself?
          #
          # The timestamp comparison below can only tell whether dist was
          # committed after the bundled sources. It cannot tell whether that
          # dist was actually produced by `npm run build:action`. The normal
          # way to ship a dist change — edit src, run build:action, commit both
          # in one commit — makes src_ts equal dist_ts, which used to satisfy
          # the skip condition and bypassed verification entirely (#1749). Any
          # change that touches dist/ is therefore always verified by rebuild.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base revision is unavailable (BASE_SHA='${BASE_SHA}'); verifying by rebuild (fail-safe)."
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- 'runners/github-action/dist/')" ]; then
            echo "This change modifies runners/github-action/dist/; rebuild verification is mandatory."
            echo "Changed dist files:"
            git diff --name-only "$BASE_SHA" HEAD -- 'runners/github-action/dist/'
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Gate 2: dist/ is untouched by this change, so the committed bundle
          # is one that already passed this job. Only a bundled-source change
          # landing without a matching rebuild can make it stale, and that is
          # exactly what the timestamp comparison detects.
          if [ -z "$src_ts" ]; then
            echo "No bundled-source commits in history; skipping dist staleness check."
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$src_ts" -le "$dist_ts" ]; then
            src_date=$(git log -1 --format=%ci -- 'runners/github-action/src/' 'runners/core/' 'src/' 'package-lock.json')
            dist_date=$(git log -1 --format=%ci -- 'runners/github-action/dist/')
            echo "dist/ is untouched by this change and is current (dist: ${dist_date}, src: ${src_date})"
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Timestamp suggests dist is stale; will rebuild to verify."
          echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.judge.outputs.needs_rebuild == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        if: steps.judge.outputs.needs_rebuild == 'true'
      - name: Rebuild and verify dist bytes
        if: steps.judge.outputs.needs_rebuild == 'true'
        run: |
          # The judge only decided that verification is warranted; the change
          # might still not affect the vendored bundle (e.g., a sibling helper
          # the action runner does not load, or a dep that ncc does not bundle).
          # package-lock.json is watched because ncc vendors production deps
          # into dist/, so a dependency bump can change the bundle without any
          # src/ change (see #1057). Rebuild and compare bytes before failing —
          # only fail if the rebuild actually produces a diff. This avoids
          # false positives that block PRs whose change is not part of the
          # shipped bundle.
          npm run build:action

          # Compare with `git status --porcelain`, not `git diff`. ncc names
          # its lazy chunks by number (dist/<n>.index.mjs), and a dependency
          # change can make it emit a chunk the commit does not contain. Such
          # a file is UNTRACKED after the rebuild, and `git diff` does not
          # report untracked files — the job would pass on a bundle that is
          # missing a chunk it needs at runtime.
          rebuild_diff=$(git status --porcelain -- runners/github-action/dist/)
          if [ -z "$rebuild_diff" ]; then
            src_date=$(git log -1 --format=%ci -- 'runners/github-action/src/' 'runners/core/' 'src/' 'package-lock.json')
            dist_date=$(git log -1 --format=%ci -- 'runners/github-action/dist/')
            echo "dist/ rebuild produced no changes; bundle is genuinely fresh (dist commit: ${dist_date}, src commit: ${src_date})."
            exit 0
          fi

          src_date=$(git log -1 --format=%ci -- 'runners/github-action/src/' 'runners/core/' 'src/' 'package-lock.json')
          dist_date=$(git log -1 --format=%ci -- 'runners/github-action/dist/')
          echo "::error::dist/ does not match a build of the current sources (src commit: ${src_date}, dist commit: ${dist_date}); the rebuild produced byte-level changes. Run 'npm run build:action' with the Node version in .nvmrc and commit the result."
          echo "Recent src changes:"
          git log -3 --oneline -- 'runners/github-action/src/' 'runners/core/' 'src/' 'package-lock.json'
          echo "Rebuild diff (git status --porcelain; '??' = a chunk the commit is missing):"
          printf '%s\n' "$rebuild_diff"
          exit 1

  integration-test:
    name: Integration (CLI)
    runs-on: ubuntu-latest
    # Runs in parallel with the unit-test matrix (which already includes the
    # integration tests via `node --test` discovery); chaining it after `test`
    # only re-ran the same files a third time at the end of the critical path.
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - name: Run CLI integration tests
        run: npm test -- tests/integration/local-review.test.mjs

  engine-install:
    name: Engine-only install (--omit=dev)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install engine deps only
        run: npm ci --omit=dev --ignore-scripts
      - name: Engine CLI runs without docs/dev dependencies
        run: |
          set -euo pipefail
          for d in react react-dom recharts @docusaurus/core @mermaid-js/layout-elk; do
            if [ -d "node_modules/$d" ]; then
              echo "::error::$d should not be installed with --omit=dev"; exit 1
            fi
          done
          node src/cli.mjs --help > /dev/null
          tmp="$(mktemp -d)"
          printf 'plan\n' > "$tmp/plan.md"
          node src/cli.mjs review plan --plan-only --phase upstream \
            --output-file "$tmp/o.json"
          node -e "const a=require(process.argv[1]); if(a.version!=='1') process.exit(1)" "$tmp/o.json"
