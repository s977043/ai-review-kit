name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-node-deps
      - name: Run linters
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ matrix.node-version }}
      # #1415 root fix: the "Unable to deserialize cloned data" flake is a
      # node:test child→parent IPC (structured-clone) bug that is independent of
      # coverage. `--experimental-test-isolation=none` runs every test file in a
      # single process, removing the child→parent IPC entirely — the root cause,
      # not just the coverage aggravator. This flag does not exist on Node 20.x,
      # which is EOL (2026-04), so the matrix is pinned to 22.x. The full suite
      # passes under single-process isolation (verified: no shared-state
      # pollution). Coverage is safe to collect now (no children to serialize).
      - name: Run unit tests (single-process isolation, #1415)
        run: NODE_V8_COVERAGE=coverage node --experimental-test-isolation=none --test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: coverage
          flags: unittests
          fail_ci_if_error: false

  skill-validation:
    name: Skill schema validation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-node-deps
      - name: Validate skills
        run: npm run skills:validate
      - name: Validate agent-skills
        run: npm run agent-skills:validate
      - name: Check dangling skill-ID references
        run: npm run skills:validate:refs
      - name: Check skill manifest freshness
        run: npm run skills:manifest:check

  meta-check:
    name: Meta consistency
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-node-deps
      - run: npm run meta:validate
      - run: npm run plugin:validate

  dist-check:
    name: Action dist freshness
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      # Timestamp judgement needs only git, so it runs BEFORE Node setup /
      # npm ci. In the common case (dist newer than bundled sources) the job
      # finishes here and skips the ~1-minute install entirely.
      - name: Judge dist freshness by commit timestamps
        id: judge
        run: |
          src_ts=$(git log -1 --format=%ct -- 'runners/github-action/src/' 'src/' 'package-lock.json')
          dist_ts=$(git log -1 --format=%ct -- 'runners/github-action/dist/')

          if [ -z "$src_ts" ]; then
            echo "No bundled-source commits in history; skipping dist staleness check."
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$dist_ts" ]; then
            echo "::error::runners/github-action/dist/ has never been committed. Run 'npm run build:action' and commit."
            exit 1
          fi

          if [ "$src_ts" -le "$dist_ts" ]; then
            src_date=$(git log -1 --format=%ci -- 'runners/github-action/src/' 'src/' 'package-lock.json')
            dist_date=$(git log -1 --format=%ci -- 'runners/github-action/dist/')
            echo "dist/ is current (dist: ${dist_date}, src: ${src_date})"
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Timestamp suggests dist is stale; will rebuild to verify."
          echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.judge.outputs.needs_rebuild == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        if: steps.judge.outputs.needs_rebuild == 'true'
      - name: Rebuild and verify dist bytes
        if: steps.judge.outputs.needs_rebuild == 'true'
        run: |
          # Timestamp says dist is stale, but the src or dependency change
          # might not affect the vendored bundle (e.g., a sibling helper the
          # action runner does not load, or a dep that ncc does not bundle).
          # package-lock.json is watched because ncc vendors production deps
          # into dist/, so a dependency bump can change the bundle without any
          # src/ change (see #1057). Rebuild and compare bytes before failing —
          # only fail if the rebuild actually produces a diff. This avoids
          # false positives that block PRs whose change is not part of the
          # shipped bundle.
          npm run build:action
          if git diff --quiet -- runners/github-action/dist/; then
            src_date=$(git log -1 --format=%ci -- 'runners/github-action/src/' 'src/' 'package-lock.json')
            dist_date=$(git log -1 --format=%ci -- 'runners/github-action/dist/')
            echo "dist/ rebuild produced no changes; bundle is genuinely fresh (dist commit: ${dist_date}, src commit: ${src_date})."
            exit 0
          fi

          src_date=$(git log -1 --format=%ci -- 'runners/github-action/src/' 'src/' 'package-lock.json')
          dist_date=$(git log -1 --format=%ci -- 'runners/github-action/dist/')
          echo "::error::dist/ is stale. Source last changed at ${src_date} but dist last rebuilt at ${dist_date}, and rebuild produced byte-level changes. Run 'npm run build:action' and commit."
          echo "Recent src changes:"
          git log -3 --oneline -- 'runners/github-action/src/' 'src/' 'package-lock.json'
          echo "Rebuild diff (file list):"
          git diff --name-only -- runners/github-action/dist/
          exit 1

  integration-test:
    name: Integration (CLI)
    runs-on: ubuntu-latest
    # Runs in parallel with the unit-test matrix (which already includes the
    # integration tests via `node --test` discovery); chaining it after `test`
    # only re-ran the same files a third time at the end of the critical path.
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-deps
      - name: Run CLI integration tests
        run: npm test -- tests/integration/local-review.test.mjs

  engine-install:
    name: Engine-only install (--omit=dev)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install engine deps only
        run: npm ci --omit=dev --ignore-scripts
      - name: Engine CLI runs without docs/dev dependencies
        run: |
          set -euo pipefail
          for d in react react-dom recharts @docusaurus/core @mermaid-js/layout-elk; do
            if [ -d "node_modules/$d" ]; then
              echo "::error::$d should not be installed with --omit=dev"; exit 1
            fi
          done
          node src/cli.mjs --help > /dev/null
          tmp="$(mktemp -d)"
          printf 'plan\n' > "$tmp/plan.md"
          node src/cli.mjs review plan --plan-only --phase upstream \
            --output-file "$tmp/o.json"
          node -e "const a=require(process.argv[1]); if(a.version!=='1') process.exit(1)" "$tmp/o.json"
