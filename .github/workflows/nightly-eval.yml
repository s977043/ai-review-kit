name: Nightly Eval

on:
  schedule:
    # Run daily at 04:00 JST (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      description:
        description: 'Optional description for the ledger entry'
        required: false
        default: ''

concurrency:
  group: nightly-eval
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  eval:
    name: Unified evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/setup-node-deps

      - name: Run unified evaluation
        env:
          DESC: ${{ github.event.inputs.description || format('nightly-{0}', github.run_id) }}
        run: |
          node scripts/evaluate-all.mjs --json --append-ledger --description "$DESC" > eval-output.json
          cat eval-output.json

      - name: Generate summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('eval-output.json')) { console.log('No eval output found'); process.exit(0); }
            const r = JSON.parse(fs.readFileSync('eval-output.json','utf8'));
            const lines = ['## Nightly Eval Summary', '',
              '| Metric | Value |', '| --- | --- |'];
            for (const [k,v] of Object.entries(r.scores)) {
              const display = typeof v === 'number' && v <= 1 ? (v*100).toFixed(1)+'%' : v;
              lines.push('| ' + k + ' | ' + display + ' |');
            }
            lines.push('', 'Status: **' + r.status.toUpperCase() + '**');
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          "

      - name: Open issue on KPI regression (improvement loop L-3)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/compare-eval-ledger.mjs > compare-output.txt 2>&1
          rc=$?
          set -e
          cat compare-output.txt
          if [ "$rc" -eq 0 ]; then
            echo "No KPI regression detected."
            exit 0
          fi
          if [ "$rc" -ne 1 ]; then
            echo "compare-eval-ledger failed with exit code $rc (fatal error, not a regression); skipping issue creation."
            exit 0
          fi
          existing=$(gh issue list --label eval-regression --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An eval-regression issue is already open; skipping creation."
            exit 0
          fi
          {
            echo "Nightly eval detected a KPI regression (improvement loop L-3 auto-trigger)."
            echo ""
            echo '```'
            cat compare-output.txt
            echo '```'
            echo ""
            echo "Next action: identify the skill behind the regressed metric and run the feedback loop (docs/development/skill-improvement-loop-design.md §3 L3)."
          } > issue-body.md
          gh issue create \
            --title "eval: nightly KPI regression detected ($(date -u +%Y-%m-%d))" \
            --label eval-regression \
            --body-file issue-body.md

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-eval-${{ github.run_id }}
          path: |
            eval-output.json
            artifacts/evals/results.jsonl
          retention-days: 90
