name: Validate Agent Specs

on:
  pull_request:
    paths:
      - 'agents/**'
      - '.github/river-review/**'
      - '.github/workflows/validate-agents.yml'
      - 'docs/agents.md'
      - 'package.json'
      - 'scripts/validate-agents.mjs'
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - '.github/river-review/**'
      - '.github/workflows/validate-agents.yml'
      - 'docs/agents.md'
      - 'package.json'
      - 'scripts/validate-agents.mjs'

permissions:
  contents: read

concurrency:
  group: validate-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Validate agent schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/setup-node-deps

      - name: Run agent schema validation
        run: npm run agents:validate
