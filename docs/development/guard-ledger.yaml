    notes: PreToolUse hook が gh write 前にアカウントを判定し、切り替えに失敗したら exit 2 でツール呼び出しを止める。残余は Claude Code の Bash ツール以外の経路（端末での直接実行）。

  - id: merge-time-checks
    title: Merge-time checks
    mechanized: partial
    verifiedBy:
