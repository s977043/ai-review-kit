    addedAt: '2026-04-16'
    reviewAfter: '2026-11-10'
    notes: 阻止ラベルは必須チェック `Blocked label guard`、dist 鮮度は必須チェック `Action dist freshness` が守る。レビューコメントの disposition と /preflight は散文のまま。 2026-08-12 の退役判定は (c) 機械化の起票であり、reviewAfter を 90 日延長した。addedAt 以降の再発として、blocked ラベルの見落としが 2 件ある（#1746・#1761。retrospectives/2026-08-04-05.md の 1 節）。この面は#1770 が入れた必須チェック Blocked label guard で機械化済みだが、レビューコメントの disposition と /preflight は散文のまま残る。決定論スライスは未対応コメントの残存を検出する gate。Issue 番号は起票後に追記する。

