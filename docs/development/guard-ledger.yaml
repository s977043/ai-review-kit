# ガード以外の期限付きの決定（#1843）。
decisions:
  - id: deprecate-close-issues-sh
    kind: deprecation
    target: scripts/close-issues.sh
    decidedIn: '#1824'
    decidedAt: '2026-08-12'
    reviewAfter: '2026-11-12'
    notes: >-
      参照ゼロの orphan script。期日はスクリプト本体のコメント（scripts/close-issues.sh:14「段階 2 — 2026-11-12
      （90 日後）以降に呼び出し元が現れなければ削除する」）が宣言している値をそのまま写した。期日到来時は呼び出し元が現れたかを
      git grep で確認し、無ければ削除する。

  - id: deprecate-setup-river-review-sh
    kind: deprecation
    target: scripts/setup_river_review.sh
    decidedIn: '#1824'
    decidedAt: '2026-08-12'
    reviewAfter: '2026-11-12'
    notes: >-
      参照ゼロの orphan script。期日は本体コメント（scripts/setup_river_review.sh:24「Stage 2 — delete
      the file on or after 2026-11-12 (90 days) if no caller」）の値。ROADMAP.md
      にも DEPRECATED と削除予定日の記載があるため、削除時は同じ PR で ROADMAP.md の記述も消す。

  - id: deprecate-release-please-kick-workflow
    kind: deprecation
    target: .github/workflows/release-please-kick.yml
    decidedIn: '#1807'
    decidedAt: '2026-08-12'
    reviewAfter: undecided
    notes: >-
      RELEASE_KICK_PAT が未登録のため常に失敗する workflow を deprecate した（#1807。本体コメントは背景 Issue の
      #1800 を参照している）。削除期日は #1807 でも本体コメントでも決まっていない。ここで新しい日付を発明せず undecided
      とし、棚卸しで「期日を決める」判断そのものを対象にする。判断材料は secret を登録して再採用するか
      （gh api repos/:owner/:repo/actions/secrets で確認）、ローカル実行の
      scripts/release-please-kick.sh へ一本化して削除するかの二択。
