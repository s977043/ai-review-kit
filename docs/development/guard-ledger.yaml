# 期限付きの決定の台帳（SSoT）。2 つのキーを持つ。
#
#   guards:    … CLAUDE.md「AI Misoperation Guards」の各ガード。CLAUDE.md はこの台帳の従属側
#   decisions: … ガード以外の期限付きの決定（deprecate した資産・観測中の workflow・
#                暫定的な除外設定など）。CLAUDE.md に対応する散文は持たない（#1843）
#
# どちらも `reviewAfter` で期日を管理する。棚卸しの起点・判断者・列挙コマンドは
# docs/development/improvement-flow.md の Step 9 が SSoT。
#
# なぜ台帳側を SSoT にするか:
#   CLAUDE.md の編集は「Always ask」に分類されており、退役の運用を回すたびに承認待ちが
#   ブロッカーになる。台帳を正とし、CLAUDE.md 側は台帳と機械照合するだけの従属側にする。
#   照合は scripts/check-doc-enumerations.mjs の spec `claude-md-guard-ledger` が行い、
#   npm run meta:validate 経由で必須チェック `Meta consistency` に載る。
#   verifiedBy のパス実在は spec `guard-ledger-verified-by` が同じ経路で検証する。
#
# guards: のフィールド:
#   id          … kebab-case の安定キー。title を変えても id は変えない
#   title       … CLAUDE.md の `- **<title>**:` と完全一致する文字列（照合キー）
#   mechanized  … full    : 違反が決定論のチェックで必ず失敗になる
#                 partial : ガードの一部の側面だけがチェックされる
#                 none    : 機械検証なし（散文のみ）
#   verifiedBy  … 機械検証の所在（repo 相対パス）。mechanized: none なら空配列
#   addedAt     … CLAUDE.md に初めて入った日（git log -S で特定。不明なら unknown）
#   reviewAfter … 退役判断の期日（既定は addedAt + 90 日）
#   notes       … mechanized の判定根拠・残余リスク
#
# decisions: のフィールド:
#   id          … kebab-case の安定キー。guards の id とも重複させない
#   kind        … deprecation        : 削除予定の資産（script / workflow など）
#                 observation        : 期間を区切って様子を見ている変更
#                 temporary-exclusion: 暫定的な除外設定（ignore / allowlist など）
#   target      … 決定の対象（repo 相対パス）。実在は spec `decision-ledger-target` が検証する
#   decidedIn   … 決定した PR / Issue 番号（`#1824` 形式）
#   decidedAt   … その PR がマージされた日
#   reviewAfter … 判断の期日。まだ決められない場合のみ 'undecided'（notes に理由が必須）
#   notes       … 期日の根拠・観測している内容・判断材料
#
# 退役の手順は docs/development/improvement-flow.md の Step 9 を参照。
# 本ファイルからガードを消すときは CLAUDE.md の該当 bullet も同じ PR で消す
# （片方だけ変えると `Meta consistency` が落ちる）。
# decisions のエントリは target を削除・撤回した PR で同時に消す
# （target が消えたまま残ると `decision-ledger-target` が落ちる）。

guards:
  - id: read-before-referencing
    title: Read before referencing
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-08'
    reviewAfter: '2026-11-10'
    notes: 初期 5 ガードの 1 件。ファイルを読んだかどうかは実行時の振る舞いであり、成果物からは判定できない。 2026-08-12 の退役判定は (c) 側の保留であり、reviewAfter を 90 日延長した。mechanized が none のため散文削除 (a) は選べず、発火実績を測る基盤が無いため (b) も選べない。引用前に読んだかどうかは成果物に痕跡が残らず、決定論スライスが見つかっていない。

  - id: run-before-claiming
    title: Run before claiming
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-08'
    reviewAfter: '2026-11-10'
    notes: >-
      初期 5 ガードの 1 件。CI 自体が主張を否定する経路はあるが、報告の真偽を直接検証する仕組みは無い。
      2026-08-12 の退役判定は (c) 機械化の起票であり、reviewAfter を 90 日延長した。addedAt
      以降の再発として、監査の看板数値 3 件が再現不能だった件（retrospectives/2026-07-24-08-02.md の 1
      節）と、件数の実測を 3 者とも grep -r の worktree 重複で誤った件（同 2026-08-04-05.md の 5
      節）がある。決定論スライスは scripts/check-doc-enumerations.mjs の spec 化の拡大。機械化 Issue は
      #1827。その 1 件目として scripts/count-in-clean-tree.sh を追加し、作業ツリー由来の 2
      汚染源（worktree の重複計上・追跡外ファイル）を計測手段の側から消した。ただし違反時に落ちるチェックではなく計測ヘルパーであるため、mechanized
      は none のままとする（使い方は docs/development/doc-enumeration-checks.md）。なお本エントリは
      2026-08-12 まで 1 行のプレーンスカラーで書かれており、` #1827` 以降がコメント扱いで 211
      文字失われていた。` #` を含む notes はブロックスカラーで書くこと。

  - id: no-silent-skips
    title: No silent skips
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-08'
    reviewAfter: '2026-11-10'
    notes: 初期 5 ガードの 1 件。報告からの省略は成果物に痕跡が残らない。 2026-08-12 の退役判定は保留であり、reviewAfter を 90 日延長した。retrospectives/2026-05-25-28.md の addendum が「completed 報告 = 配線済みではない」事例を記録しているが、これは producer 側テストの欠落であり、本ガードが対象とする報告からの省略とは別クラスと判断した。報告からの省略は成果物に痕跡が残らない。

  - id: search-before-inventing
    title: Search before inventing
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-08'
    reviewAfter: '2026-11-10'
    notes: 初期 5 ガードの 1 件。「Import the SSoT」が同じ失敗の一部を具体化しているため、統合候補。 2026-08-12 の退役判定は保留であり、reviewAfter を 90 日延長した。addedAt 以降の再発（#1650・#1656 の SSoT 再実装 2 波）は「Import the SSoT, never re-derive it」が具体化して受け持っており、そちらは partial かつ突合テストを持つ。両者の統合可否を次回の判定で扱う。mechanized が none のため今回の削除は不可。

  - id: diff-only-what-exists
    title: Diff only what exists
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-08'
    reviewAfter: '2026-11-10'
    notes: 初期 5 ガードの 1 件。.claude/rules/review-core.md が同趣旨をプロンプト規則として持つが、機械検証ではない。 2026-08-12 の退役判定は保留であり、reviewAfter を 90 日延長した。addedAt 以降の再発を retrospectives 配下から特定できなかった。.claude/rules/review-core.md が同趣旨をプロンプト規則として持つが機械検証ではなく、mechanized は none のままとする。

  - id: research-before-proposing
    title: Research before proposing
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-11'
    reviewAfter: '2026-11-10'
    notes: /propose-issue が手順を提供するのみ。Issue 本文の裏取り有無を機械判定する仕組みは無い。 2026-08-12 の退役判定は保留であり、reviewAfter を 90 日延長した。addedAt 以降の再発を retrospectives 配下から特定できなかった。Issue 本文の裏取りは CI の観測外であり、決定論スライスが見つかっていない。

  - id: propagate-signatures
    title: Propagate signatures
    mechanized: partial
    verifiedBy:
      - scripts/lib/pipeline-call-sites.mjs
      - scripts/check-doc-enumerations.mjs
      - tests/check-doc-enumerations.test.mjs
      - docs/development/pipeline-params-checklist.md
    addedAt: '2026-04-11'
    reviewAfter: '2026-11-10'
    notes: >-
      addedAt 以降の再発として、riskAssessment が buildExecutionPlan で計算されながら返却されず、consumer
      側が undefined を受け取っていた件がある（retrospectives/2026-05-25-28.md の addendum、#933）。
      #1827 で (c) 機械化のうち決定論スライスを実装した。check-doc-enumerations.mjs の spec
      `pipeline-callsites-*` が pipeline-params-checklist.md の call site 一覧と実体の call site
      走査を集合一致で照合し、必須チェック `Meta consistency` に載る。導入時点で src/cli/commands/skills.mjs
      など 5 件の未記載 call site を検出し、チェックリストへ追記した。partial に留まる理由は、機械検証の対象が
      「チェックリストが実体と一致していること」であり、個々のパラメータが各 call site で転送されているかは見ないため。
      呼び出しはすべて options オブジェクト 1 個で渡され、どのキーが必須かが型に無く決定論では判定できない。
      転送漏れ自体は引き続きチェックリストと producer/consumer 双方を assert するテスト形（review-runner-snapshot-field
      と同型）で守る。full への到達には後者の常設化が必要。

  - id: plan-merge-order
    title: Plan merge order
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-11'
    reviewAfter: '2026-11-10'
    notes: /plan-merge-order は手順コマンド。実行したかどうかは検証されない。 2026-08-12 の退役判定は保留であり、reviewAfter を 90 日延長した。addedAt 以降の再発を retrospectives 配下から特定できなかった。マージ順序の事前計画を実行したかどうかはリポジトリ状態に残らない。

  - id: commit-before-branch-switches
    title: Commit before branch switches
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-11'
    reviewAfter: '2026-11-10'
    notes: .claude/hooks/no-force-push.sh は force push を止めるが、switch 前の WIP commit は対象外。 2026-08-12 の退役判定は保留であり、reviewAfter を 90 日延長した。addedAt 以降に観測された switch 系の事故（worktree が握るブランチへの switch 失敗）は「Worktree-held branches refuse switch」が受け持っている。本ガード自体の再発は特定できなかった。

  - id: verify-git-output-before-chaining
    title: Verify git output before chaining
    mechanized: none
    verifiedBy: []
    addedAt: '2026-04-11'
    reviewAfter: '2026-11-10'
    notes: 出力を読んだかどうかは判定できない。 2026-08-12 の退役判定は保留であり、reviewAfter を 90 日延長した。addedAt 以降の観測は、本ガードを拡張した「Worktree-held branches refuse switch」として既に独立している。出力を読んだかどうかは判定できず、決定論スライスが見つかっていない。

  - id: verify-gh-active-account
    title: Verify gh active account before write ops
    mechanized: partial
    verifiedBy:
      - .claude/hooks/gh-account-guard.sh
      - .claude/settings.json
    addedAt: '2026-06-11'
    reviewAfter: '2026-09-09'
    notes: PreToolUse hook が gh write 前にアカウントを判定し、切り替えに失敗したら exit 2 でツール呼び出しを止める。残余は 2 つある。1 つは Claude Code の Bash ツール以外の経路（端末での直接実行）。もう 1 つは read 系であり、hook は WRITE_RE に一致する write op だけを検査する設計のため read は無検査で通す（read の失敗は壊さないのでブロック不要という判断）。read 側の 404 / Could not resolve to a Repository をアカウント切り替わりとして疑う診断は CLAUDE.md の散文のみが担う。この write は機械保証・read は散文のみという非対称のため、mechanized は full ではなく partial である。

  - id: merge-time-checks
    title: Merge-time checks
    mechanized: partial
    verifiedBy:
      - .github/workflows/blocked-label-guard.yml
      - .github/workflows/test.yml
      - scripts/check-comment-disposition.mjs
      - tests/check-comment-disposition.test.mjs
      - .claude/commands/merge-check.md
    addedAt: '2026-04-16'
    reviewAfter: '2026-11-10'
    notes: >-
      阻止ラベルは必須チェック `Blocked label guard`、dist 鮮度は必須チェック `Action dist freshness` が守る。
      2026-08-12 の退役判定は (c) 機械化の起票であり、reviewAfter を 90 日延長した。addedAt 以降の再発として、
      blocked ラベルの見落としが 2 件ある（#1746・#1761。retrospectives/2026-08-04-05.md の 1 節）。この面は
      #1770 が入れた必須チェック Blocked label guard で機械化済みである。
      #1827 でレビューコメント面の決定論スライスを実装した。scripts/check-comment-disposition.mjs が
      pulls/<N>/comments と issues/<N>/comments を両方 --paginate で取得し、GitHub API の user.type が
      "User" のコメントだけを disposition の作業リストとして列挙する（人間由来 0 件で exit 0、1 件以上で exit 1）。
      配線先は /merge-check の Step 2 であり、CI の必須チェックにはしていない。
      partial に留める理由は 2 つある。1 つは、機械化したのが「列挙の網羅」だけであり、各コメントが
      dispose 済みかどうかは判定していないこと（返信・reaction・review state のいずれからも決定論では読めず、
      2026-08-04 の #1746 の実失敗も列挙漏れ側にあたる）。もう 1 つは、CI で強制されず /merge-check から
      呼ばれるだけであるため、実行しないという選択が依然として可能なこと。必須チェック化は
      「人間コメントが 1 件付いた瞬間に恒久的にマージ不能になる」誤停止を生み、improvement-flow.md の
      「止めるべきでないものを止めない」を満たせないため採らなかった。/preflight の実施も散文のまま残る。
      2026-08-12 の再発として、release PR #1830 のマージで Issue #1827 が事故で close された
      （retrospectives/2026-08-12.md の O5）。PR 本文の closing keyword 確認を /merge-check の Step 6 と
      governance.md のチェックリスト 6 番へ追加し、/release-kick の Step 7 から参照させた。
      これは手順の追加であって機械検証ではないため mechanized は partial のまま据え置く。

