name: 'River Review'
description: 'Run River Review CLI with phase-aware planning.'
inputs:
  phase:
    description: 'Review phase (upstream|midstream|downstream).'
    required: false
    default: 'midstream'
  planner:
    description: 'Planner mode (off|order|prune).'
    required: false
    default: 'off'
  target:
    description: 'Path to the git repository to review.'
    required: false
    default: '.'
  comment:
    description: 'Post a PR comment with results (only on pull_request events).'
    required: false
    default: 'true'
  inline_comments:
    description: 'Post inline review comments on changed lines (requires output_format=json or forces json internally).'
    required: false
    default: 'false'
  dry_run:
    description: 'Run in dry-run mode (no external calls, print to stdout).'
    required: false
    default: 'true'
  debug:
    description: 'Print debug information (merge base, token estimates, prompt preview).'
    required: false
    default: 'false'
  estimate:
    description: 'Estimate cost only without running the review.'
    required: false
    default: 'false'
  max_cost:
    description: 'Abort if estimated USD cost exceeds this value.'
    required: false
    default: ''
  node_version:
    description: 'Node.js version to use.'
    required: false
    default: '22'
  output_format:
    description: 'Output format (text|markdown|json|yaml|html).'
    required: false
    default: 'markdown'
  gate:
    description: >-
      Enforce the gate decision as the job status (Epic #1347 S4): pass --gate so
      GO/GO_WITH_OBSERVATION exit 0, NO_GO exits 1, ESCALATE exits 3 — a non-zero
      exit fails the job. Default false keeps advisory behavior (findings are
      reported but never fail the job). Adopt in two stages: watch advisory
      results first, then set gate=true.
    required: false
    default: 'false'
  deterministic_exec:
    description: >-
      Opt in to running skills' deterministicGate.command in a sandbox (#1401).
      Default false — the command executor is never invoked and behavior is
      unchanged. When true you MUST also pass trusted_tree; if it is empty or
      missing, this input is ignored (fail-safe, executor stays off). The
      allowlist is read ONLY from trusted_tree (the host-trusted base checkout),
      never from the reviewed target, so an author under review cannot allowlist
      their own command. Dark-launch: even when enabled the gate stays advisory
      unless you also set gate=true, so an unrunnable/failed command surfaces as
      ESCALATE/NO_GO in the report without failing the job.
    required: false
    default: 'false'
  trusted_tree:
    description: >-
      Absolute path to a host-trusted BASE checkout of the repository, used only
      when deterministic_exec=true as the sole source of the deterministic
      allowlist (.river/deterministic-allowlist.yaml). Check the base ref out to
      a separate path with actions/checkout (persist-credentials: false) and pass
      that path here. Leave empty to keep the executor off. Never point this at
      the PR-head checkout being reviewed (that would break the trust boundary).
    required: false
    default: ''
  entry:
    description: >-
      (Beta, #2054 PR-5) Review Flow entry name to pin the emitted Review
      Artifact to (a key of flows/entry-map.json `entries`, e.g. review-plan,
      review-task, review-final). When set, the step runs
      `review plan --plan-only --entry <entry>` instead of `run` and emits the
      Review Artifact (JSON, or Markdown when output_format=markdown); the
      artifact carries `flow` and `evidenceRequirements`. The name is passed
      through verbatim — the Action holds no judgment about it (ADR-009 D3).
      Leave empty (default) to keep the `run` command path exactly as before.
      When set, gate / dry_run / estimate / max_cost / comment / inline_comments
      do not apply (plan-only runs no review, so there is nothing to gate or
      to post).
    required: false
    default: ''
outputs:
  json_path:
    description: 'Path to the JSON output file (only when output_format=json).'
    value: ${{ steps.river.outputs.json_path }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
    - name: Run River Review
      id: river
      shell: bash
      env:
        RIVER_REPO_ROOT: ${{ github.action_path }}/../..
        RIVER_OUTPUT_FORMAT: ${{ inputs.output_format }}
        # Pass the deterministic-exec opt-in inputs via env (not inline ${{ }})
        # so no input value is expanded into the shell script — the GitHub
        # hardening pattern against script injection (#1401 (d) review).
        INPUT_DETERMINISTIC_EXEC: ${{ inputs.deterministic_exec }}
        INPUT_TRUSTED_TREE: ${{ inputs.trusted_tree }}
        # Same env passthrough for the Beta Flow entry name (#2054 PR-5): the
        # value never reaches the shell script as an expanded expression.
        INPUT_ENTRY: ${{ inputs.entry }}
      run: |
        set -euo pipefail
        export RIVER_REPO_ROOT="$(cd "${RIVER_REPO_ROOT}" && pwd)"
        repo_path="$(cd "${{ inputs.target }}" && pwd)"

        # #1401 §11.8 (d): deterministic-command executor opt-in (dark-launch,
        # default OFF). Both conditions must hold or the executor stays off
        # (fail-safe): deterministic_exec=true AND trusted_tree resolves to an
        # existing directory. RIVER_TRUSTED_TREE is the SOLE allowlist source
        # (must be a host-trusted base checkout, never the reviewed target).
        if [ "${INPUT_DETERMINISTIC_EXEC}" = "true" ]; then
          trusted_in="${INPUT_TRUSTED_TREE}"
          if [ -n "${trusted_in}" ] && [ -d "${trusted_in}" ]; then
            # `cd --` so a trusted_tree value beginning with '-' is treated as a
            # path, not a cd option.
            trusted_abs="$(cd -- "${trusted_in}" && pwd)"
            # Defense-in-depth: refuse to treat the reviewed target (PR head) as
            # the trusted allowlist source. If they resolve to the same path the
            # author has misconfigured trusted_tree, which would let an author
            # under review allowlist their own command — the exact RCE this gate
            # prevents. Stay OFF (fail-safe) rather than trust the PR head.
            if [ "${trusted_abs}" = "${repo_path}" ]; then
              echo "::warning::trusted_tree resolves to the reviewed target ('${repo_path}'); it must be a separate host-trusted base checkout. Deterministic command execution stays OFF (fail-safe)."
            else
              export RIVER_TRUSTED_TREE="${trusted_abs}"
              export RIVER_DETERMINISTIC_EXEC=1
              echo "Deterministic exec: ON (trusted tree: ${RIVER_TRUSTED_TREE})"
            fi
          else
            echo "::warning::deterministic_exec=true but trusted_tree is empty or not a directory; deterministic command execution stays OFF (fail-safe)."
          fi
        fi

        # Validate output format
        output_fmt="${RIVER_OUTPUT_FORMAT}"
        if [[ ! "${output_fmt}" =~ ^(text|markdown|json|yaml|html)$ ]]; then
          echo "::error::Invalid output_format: ${output_fmt}"
          exit 1
        fi

        # When inline_comments=true, force json output for structured findings data
        if [ "${{ inputs.inline_comments }}" = "true" ]; then
          output_fmt="json"
        fi

        if [ -n "${INPUT_ENTRY}" ]; then
          # #2054 PR-5 (Beta): an entry name selects the `review plan` path.
          # Only the entry name is forwarded; `review plan` accepts json /
          # markdown, so the other formats fall back to json for this path.
          plan_fmt="json"
          if [ "${output_fmt}" = "markdown" ]; then
            plan_fmt="markdown"
          fi
          cmd=(node "${GITHUB_ACTION_PATH}/dist/index.mjs" review plan "${repo_path}" --plan-only --entry "${INPUT_ENTRY}" --phase "${{ inputs.phase }}" --output "${plan_fmt}")
          output_fmt="${plan_fmt}"
        else
          cmd=(node "${GITHUB_ACTION_PATH}/dist/index.mjs" run "${repo_path}" --phase "${{ inputs.phase }}" --planner "${{ inputs.planner }}" --output "${output_fmt}")
        fi
        # dry_run / estimate / max_cost describe the `run` path only: `review
        # plan --plan-only` calls no model, so they are not forwarded there.
        if [ -z "${INPUT_ENTRY}" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
          cmd+=("--dry-run")
        fi
        if [ "${{ inputs.debug }}" = "true" ]; then
          cmd+=("--debug")
        fi
        if [ -z "${INPUT_ENTRY}" ] && [ "${{ inputs.estimate }}" = "true" ]; then
          cmd+=("--estimate")
        fi
        if [ -z "${INPUT_ENTRY}" ] && [ -n "${{ inputs.max_cost }}" ]; then
          cmd+=("--max-cost" "${{ inputs.max_cost }}")
        fi
        # Epic #1347 S4: opt-in gate enforcement. --gate makes NO_GO/ESCALATE a
        # non-zero exit; default (gate=false) stays advisory. Not forwarded on
        # the entry path: `review plan --plan-only` runs no review, so its gate
        # is always NOT_EXECUTED and --gate would fail the job unconditionally.
        if [ -z "${INPUT_ENTRY}" ] && [ "${{ inputs.gate }}" = "true" ]; then
          cmd+=("--gate")
        fi
        echo "Running: ${cmd[*]}"

        # Capture the CLI exit code rather than letting `set -e` abort the step
        # immediately, so the output wiring below still runs (json_path is needed
        # by the inline-comment step). We re-exit with the captured code at the
        # end, so a --gate NO_GO/ESCALATE still fails the job.
        rc=0
        if [ "${output_fmt}" = "json" ]; then
          json_out="${RUNNER_TEMP}/river-review-output.json"
          "${cmd[@]}" > "${json_out}" || rc=$?
          echo "json_path=${json_out}" >> "${GITHUB_OUTPUT}"
          cat "${json_out}"
        else
          out="${RUNNER_TEMP}/river-review-comment.md"
          "${cmd[@]}" | tee "${out}" || rc=$?
          echo "comment_path=${out}" >> "${GITHUB_OUTPUT}"
        fi
        if [ "${rc}" -ne 0 ]; then
          if [ "${{ inputs.gate }}" = "true" ]; then
            echo "::warning::River Review exited ${rc} (gate enforcement — see the 'Gate:' line above)."
          else
            echo "::warning::River Review exited ${rc}."
          fi
          exit "${rc}"
        fi

    # Both comment steps are skipped when `entry` is set (#2054 PR-5): the
    # plan-only artifact is a Review Artifact, not review findings, and belongs
    # in the job log / an uploaded artifact rather than a PR comment.
    - name: Post PR comment
      if: ${{ github.event_name == 'pull_request' && inputs.entry == '' && inputs.comment == 'true' && inputs.estimate != 'true' && inputs.output_format != 'json' && inputs.inline_comments != 'true' }}
      uses: actions/github-script@v8
      env:
        RIVER_REVIEWER_COMMENT_PATH: ${{ steps.river.outputs.comment_path }}
      with:
        script: |
          const postComment = require(`${process.env.GITHUB_ACTION_PATH}/post-comment.cjs`);
          await postComment({ github, context, core });

    - name: Post inline review comments
      if: ${{ github.event_name == 'pull_request' && inputs.entry == '' && inputs.comment == 'true' && inputs.inline_comments == 'true' && inputs.estimate != 'true' }}
      uses: actions/github-script@v8
      env:
        RIVER_REVIEWER_JSON_PATH: ${{ steps.river.outputs.json_path }}
      with:
        script: |
          const postInline = require(`${process.env.GITHUB_ACTION_PATH}/post-inline-comments.cjs`);
          await postInline({ github, context, core });
branding:
  icon: 'play-circle'
  color: 'blue'
