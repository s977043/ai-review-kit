# ------------------------------------------------------------------
# Skill Packs (distribution units for bundled open review knowledge)
# Schema: schemas/pack.schema.json / Design: docs/development/skill-pack-design.md
# Resolution: `--skill-set <id>` checks packs first, then recommendations.
# ------------------------------------------------------------------
packs:
  - id: typescript
    version: '0.2.0'
    name: 'TypeScript Review Pack'
    description: 'TypeScript の型安全・null 安全・型駆動設計のレビュー基準'
    axis: technology
    tier: official
    sources:
      - name: 'TypeScript Handbook'
        version: 'TS 5.x'
        url: 'https://www.typescriptlang.org/docs/handbook/'
        reviewed_at: '2026-06-10'
    skills:
      - typescript-strict
      - typescript-nullcheck
      - type-driven-design

  # 設計手法軸の実証 pack（skill-pack-design.md §3）。
  # degraded mode: bounded-context は artifact / 設計ドキュメント差分にのみ反応し、
  # diff 単体のリポジトリでは ubiquitous-language-naming / type-driven-design が
  # 空振りを防ぐ。
  - id: ddd
    version: '0.2.0'
    name: 'Domain-Driven Design Review Pack'
    description: '境界づけられたコンテキスト・ユビキタス言語・型駆動のドメインモデリングのレビュー基準'
    axis: methodology
    tier: community
    sources:
      - name: 'Domain-Driven Design (Eric Evans)'
        version: '2003 / Evans classification'
        url: 'https://www.domainlanguage.com/ddd/'
        reviewed_at: '2026-06-10'
    skills:
