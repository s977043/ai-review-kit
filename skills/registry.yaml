# River Review Skills Registry
# Version 1.0

version: '1.0'
description: 'Catalog of all River Review skills organized by stream category and tags'

# Skill Catalog
#
# 各エントリの構造フィールド（id / version / name / category / phase / tags / severity）は
# 対応する SKILL.md frontmatter を SSoT として自動生成される（#1562）。手編集せず、frontmatter を
# 変更したうえで `npm run skills:registry`（scripts/generate-registry-fields.mjs）で同期すること。
# `path` は生成元 SKILL.md を指す結合キー。`recommended` / `description` / `exclude` はカタログ
# キュレーション情報であり手編集で維持する（自動生成の対象外）。applyTo は frontmatter のみに置き、
# 二重管理を避けるため registry には持たない。CI は `npm run skills:registry:check` で鮮度を守る。
#
# 各エントリの `description` は adopter がカタログを見るための短い要約であり（英語・短縮表現可）、
# 対応する SKILL.md frontmatter の `description`（レビュー実行時に参照する詳細記述・SSoT）と
# 文言を一致させる必要はない。両者は役割が異なる（カタログ要約 vs 実行時詳細）ため、不一致を
# 「ドリフト」とみなして機械的に揃えないこと。ただし同一言語・同一意図のまま字句だけがずれた
# 場合は、要約としての簡潔さを保ちつつ frontmatter 側の意図を反映するように整える。詳細は
# docs/skills-structure.md を参照。
