version: 1
rules:
  - expected: GitHub
    pattern:
      - /[Gg]ithub/
      - /(?<![A-Za-z0-9_.-])GITHUB(?![A-Za-z0-9_.-])/
  - expected: AI
    pattern: /(?<![A-Za-z0-9_.-])[Aa][Ii](?![A-Za-z0-9_.-])/
  - expected: JavaScript
    pattern:
      - /(?<![A-Za-z0-9_.-])[Jj]ava[Ss]cript(?![A-Za-z0-9_.-])/
      - /\bJS\b/
  - expected: VS Code
    pattern:
      - /VSCode/
      - /vscode/
      - /Visual Studio Code/
  - expected: Docusaurus
    pattern: /[Dd]ocusaurus/
  - expected: Node.js
    pattern:
      - /[Nn]ode\.js/
      - /NodeJS/
      - /nodejs/
