# .river-review.yaml の selection サンプル: SDD（仕様駆動開発 / plan 駆動開発）向け
# pbi-input / plan / ADR などの上流アーティファクトを起点に、仕様と実装の整合を多段で検査する。
# artifact の渡し方は pages/reference/artifact-input-contract.md を参照。
# selection は .river-review.yaml の設定として実装済み（--skill-set 指定時は CLI が優先）。
selection:
  packs: []
  tags:
    - plangate # PlanGate 連携の整合チェック群
  skills:
    include:
      # 仕様・計画の品質（実装前ゲート）
      - requirements-acceptance # 受け入れ基準・スコープの明確性
      - plangate-plan-integrity # pbi-input / plan / todo / test-cases の整合
      # 実装と計画の整合（実装中ゲート）
      - plangate-exec-conformance # 差分が plan から逸脱していないか
      - adr-decision-quality # ADR の意思決定品質
      - architecture-traceability # ADR・図・仕様間のドリフト検知
      # レビュー結果の再点検（検証ゲート、W チェック）
      - plangate-verification-audit
    exclude: []
  minTier: community
