# .river-review.yaml の selection サンプル: TDD（テスト駆動開発）チーム向け
# テストファースト運用を前提に、テスト雛形生成（upstream）からカバレッジ検査（downstream）までを束ねる。
# selection は .river-review.yaml の設定として実装済み（--skill-set 指定時は CLI が優先）。
selection:
  packs: []
  tags:
    - unit-test # test scaffold 系 skill を横断追加
    - tdd
  skills:
    include:
      # 仕様からテスト雛形を生成する upstream skill（スタックに合わせて取捨選択する）
      - code-unit-ts-jest # TypeScript (Jest/Vitest)
      - code-react # React コンポーネント (RTL)
      # 実装中〜実装後のテスト品質ゲート
      - test-existence # 変更に対応するテストの存在
      - coverage-gap # カバレッジの穴
      - test-naming # テスト名の意図明確性
      - flaky-test # flaky パターンの検出
    exclude: []
  minTier: community
