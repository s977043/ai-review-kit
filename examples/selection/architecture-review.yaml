# .river-review.yaml の selection サンプル: アーキテクチャ重視チーム向け（DDD / マイクロサービス境界）
# 設計ドキュメント・ADR を継続的にレビューし、境界・契約・運用性のドリフトを防ぐ。
# selection は .river-review.yaml の設定として実装済み（--skill-set 指定時は CLI が優先）。
selection:
  packs:
    - ddd # bounded-context / type-driven-design / ubiquitous-language-naming（community tier）
  tags:
    - architecture
  skills:
    include:
      - architecture-boundaries # 境界・依存方向・所有権
      - data-flow-state-ownership # データフローと状態の所有
      - integration-contracts # サービス間契約
      - event-driven-semantics # イベント駆動の配信保証・冪等性
      - api-versioning-compat # API 互換性と versioning
      - trust-boundaries-authz # 信頼境界と認可
    exclude: []
  minTier: community # packs への明示指定（ddd）は minTier より優先される（警告のみ）
