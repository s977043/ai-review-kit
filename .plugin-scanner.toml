[scanner]
# Paths that intentionally contain secret-like patterns (test fixtures, redactor
# implementation, eval artifacts) and build/tooling outputs that are not part of
# the distributed plugin surface.
ignore_paths = [
  "tests/**",
  # 一時: #2152 の通知ワークフローが実際に発火するかを確かめるための行。マージしない。
  "pages/**",
  "scripts/**",
  "artifacts/**",
  "build/**",
  "runners/github-action/dist/**",
  ".claude/**",
  "node_modules/**",
  "skills/*/fixtures/**",
  # False positives: these files contain secret-pattern regexes (redactor),
  # eval-detection logic, and path strings — not actual secrets or dynamic eval.
  "src/lib/review-engine.mjs",
  "src/lib/heuristic-review.mjs",
  "runners/cli/src/commands/create.mjs",
  # False positive: the scanner's HARDCODED_SECRET heuristic flags the long
  # kebab-case ADR filename (docs/adr/003-risk-tiered-…) referenced in these
  # prose docs as secret material (verified by bisect: the bare slug alone
  # triggers it; the surrounding sentences do not). Prose-only files.
  "docs/vision.md",
  "pages/explanation/design-philosophy.md",
  "pages/explanation/design-philosophy.en.md",
  "docs/development/1401-deterministic-command-execution-design.md",
]
